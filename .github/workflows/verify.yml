name: Verify replication code
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      LIQ_AUTORUN: 'false'
      LIQ_CITL_REPAIR_AUTORUN: 'false'
      LIQ_INSTALL_MISSING: 'false'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.0'
          use-public-rspm: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install R dependencies
        run: Rscript 00_INSTALL.R
      - name: Check R syntax, endpoints, projection, guards and CITL
        run: Rscript 01_QUICK_CHECK.R
      - name: Verify archived numerical evidence independently
        run: python scripts/verify_reference.py
      - name: Parse all R entry points
        run: Rscript -e 'for (p in list.files(".", "[.]R$", recursive=TRUE, full.names=TRUE)) parse(p)'
      - name: Exercise one illustrative fitting pipeline
        if: runner.os == 'Linux'
        run: Rscript 02_RUN_EXAMPLE.R
      - name: Report runtime
        run: Rscript -e 'sessionInfo()'
